name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    # macos-14 runners were retired. Xcode 16.4 (macOS 15 SDK) keeps the
    # same look as earlier releases; Xcode 26 would opt into the macOS 26 UI.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Build
        run: |
          cd SSHTunnelManager
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version $VERSION (build ${GITHUB_RUN_NUMBER})"
          xcodebuild -scheme SSHTunnelManager \
            -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Ad-hoc sign
        run: |
          APP=SSHTunnelManager/build/Build/Products/Release/SSHTunnelManager.app
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"

      - name: Create DMG
        run: |
          python3 -m venv .dmgvenv
          .dmgvenv/bin/pip install --quiet dmgbuild==1.6.7
          DMG_APP="SSHTunnelManager/build/Build/Products/Release/SSHTunnelManager.app" \
          DMG_BACKGROUND="$PWD/packaging/dmg-background.tiff" \
            .dmgvenv/bin/dmgbuild -s packaging/dmg_settings.py "SSH Tunnel Manager" SSHTunnelManager.dmg

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: SSHTunnelManager.dmg
          generate_release_notes: true
          # Tags like v1.9.1-rc1 become pre-releases: visible on the releases
          # page for manual testing, but ignored by the Homebrew tap sync,
          # which only follows releases/latest.
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
